name: Swift macOS Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag in numeric vMAJOR.MINOR.PATCH format, for example v0.1.2
        required: true
        type: string
      distribution:
        description: github uses local self-signing; developer-id also notarizes
        required: true
        default: github
        type: choice
        options:
          - github
          - developer-id
      enable_sparkle:
        description: Generate appcast and embed Sparkle feed/key
        required: true
        default: false
        type: boolean
      feed_url:
        description: Stable HTTPS Sparkle appcast URL, only used when enable_sparkle is true
        required: false
        default: https://github.com/GravityPoet/chatgpt-web-desktop/releases/latest/download/appcast.xml
        type: string
      draft:
        description: Create a draft release when the tag does not exist
        required: true
        default: true
        type: boolean
      prerelease:
        description: Mark the release as prerelease when the tag does not exist
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: swift-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  intel-validation:
    name: Validate Swift app on Intel
    runs-on: macos-15-intel
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        working-directory: swift

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record Intel runner and toolchain
        run: |
          uname -a
          uname -m
          sw_vers
          xcode-select -p
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version
          test "$(uname -m)" = "x86_64"
          test -d "$DEVELOPER_DIR"
          xcodebuild -version | grep -q '^Xcode 16\.4'

      - name: Build Intel release configuration
        run: swift build -c release --arch x86_64

      - name: Run Intel Swift tests
        run: swift test --arch x86_64

      - name: Run Intel strict-concurrency tests
        run: swift test --arch x86_64 -Xswiftc -strict-concurrency=complete

      - name: Smoke-test the native Intel app slice
        env:
          CHATGPT_SWIFT_SMOKE_ARCH: x86_64
        run: ./script/build_and_run.sh --verify

  release:
    name: Build and publish Swift macOS app
    needs: intel-validation
    runs-on: macos-15
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        working-directory: swift

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record arm64 runner and toolchain
        run: |
          uname -a
          uname -m
          sw_vers
          xcode-select -p
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version
          test "$(uname -m)" = "arm64"
          test -d "$DEVELOPER_DIR"
          xcodebuild -version | grep -q '^Xcode 16\.4'

      - name: Prepare release version
        env:
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: tag must use numeric vMAJOR.MINOR.PATCH format: $TAG" >&2
            exit 2
          fi
          if [[ ! "$RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "error: github.run_id is not a positive integer: $RUN_ID" >&2
            exit 2
          fi
          {
            echo "CHATGPT_SWIFT_SHORT_VERSION=${TAG#v}"
            echo "CHATGPT_SWIFT_BUILD_NUMBER=$RUN_ID"
          } >>"$GITHUB_ENV"

      - name: Validate tag target
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          tag_error_file="$(mktemp -t chatgpt-swift-tag-error.XXXXXX)"
          if tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>"$tag_error_file")"; then
            rm -f "$tag_error_file"
            tag_type="$(jq -r '.object.type' <<<"$tag_ref")"
            tag_sha="$(jq -r '.object.sha' <<<"$tag_ref")"
            while [[ "$tag_type" == "tag" ]]; do
              tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha")"
              tag_type="$(jq -r '.object.type' <<<"$tag_object")"
              tag_sha="$(jq -r '.object.sha' <<<"$tag_object")"
            done
            if [[ "$tag_type" != "commit" || "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "error: existing tag $TAG points to $tag_sha, but this run builds $GITHUB_SHA" >&2
              exit 2
            fi
            echo "existing tag $TAG points to this commit: $GITHUB_SHA"
          else
            if grep -Eiq '(^|[^0-9])404([^0-9]|$)|not found|tag not found' "$tag_error_file"; then
              rm -f "$tag_error_file"
              echo "tag $TAG does not exist; a new tag will be created at $GITHUB_SHA"
            else
              cat "$tag_error_file" >&2
              rm -f "$tag_error_file"
              echo "error: unable to verify whether tag $TAG exists" >&2
              exit 2
            fi
          fi

      - name: Validate release prerequisites
        env:
          CHATGPT_SWIFT_DISTRIBUTION: ${{ inputs.distribution }}
          CHATGPT_SWIFT_ENABLE_SPARKLE: ${{ inputs.enable_sparkle }}
          CHATGPT_SWIFT_CERTIFICATE_P12_BASE64: ${{ secrets.CHATGPT_SWIFT_CERTIFICATE_P12_BASE64 }}
          CHATGPT_SWIFT_CERTIFICATE_PASSWORD: ${{ secrets.CHATGPT_SWIFT_CERTIFICATE_PASSWORD }}
          CHATGPT_SWIFT_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.CHATGPT_SWIFT_SPARKLE_PUBLIC_ED_KEY }}
          CHATGPT_SWIFT_SPARKLE_ED_PRIVATE_KEY: ${{ secrets.CHATGPT_SWIFT_SPARKLE_ED_PRIVATE_KEY }}
          CHATGPT_SWIFT_SPARKLE_FEED_URL: ${{ inputs.feed_url }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          sparkle="off"
          if [[ "$CHATGPT_SWIFT_ENABLE_SPARKLE" == "true" ]]; then
            if [[ "$CHATGPT_SWIFT_DISTRIBUTION" != "developer-id" ]]; then
              echo "error: Sparkle requires a stable Developer ID signature in CI; choose distribution=developer-id." >&2
              exit 2
            fi
            sparkle="on"
          fi
          ./packaging/check-release-readiness.sh --env --distribution "$CHATGPT_SWIFT_DISTRIBUTION" --sparkle "$sparkle"

      - name: Run source and workflow checks
        run: |
          brew list actionlint >/dev/null 2>&1 || brew install actionlint
          brew list shellcheck >/dev/null 2>&1 || brew install shellcheck
          ./script/check-source.sh

      - name: Run Swift tests
        run: swift test

      - name: Run Swift strict-concurrency tests
        run: swift test -Xswiftc -strict-concurrency=complete

      - name: Smoke-test the real app bundle
        run: ./script/build_and_run.sh --verify

      - name: Smoke-test the universal Intel slice through Rosetta
        run: ./script/build_and_run.sh --verify-x86_64

      - name: Import Developer ID certificate
        if: ${{ inputs.distribution == 'developer-id' }}
        env:
          CHATGPT_SWIFT_CERTIFICATE_P12_BASE64: ${{ secrets.CHATGPT_SWIFT_CERTIFICATE_P12_BASE64 }}
          CHATGPT_SWIFT_CERTIFICATE_PASSWORD: ${{ secrets.CHATGPT_SWIFT_CERTIFICATE_PASSWORD }}
        run: |
          identity="$(./packaging/import-ci-certificate.sh)"
          {
            echo "CHATGPT_SWIFT_CODESIGN_IDENTITY=$identity"
            echo "CHATGPT_SWIFT_CODESIGN_TIMESTAMP=1"
          } >>"$GITHUB_ENV"

      - name: Build signed DMG with Sparkle configuration
        env:
          ENABLE_SPARKLE: ${{ inputs.enable_sparkle }}
          RELEASE_FEED_URL: ${{ inputs.feed_url }}
          RELEASE_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.CHATGPT_SWIFT_SPARKLE_PUBLIC_ED_KEY }}
        run: |
          if [[ "$ENABLE_SPARKLE" == "true" ]]; then
            export CHATGPT_SWIFT_SPARKLE_FEED_URL="$RELEASE_FEED_URL"
            export CHATGPT_SWIFT_SPARKLE_PUBLIC_ED_KEY="$RELEASE_SPARKLE_PUBLIC_ED_KEY"
          fi
          ./packaging/make-dmg.sh

      - name: Notarize and staple DMG
        if: ${{ inputs.distribution == 'developer-id' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: ./packaging/notarize-dmg.sh

      - name: Generate signed Sparkle appcast
        if: ${{ inputs.enable_sparkle }}
        env:
          CHATGPT_SWIFT_SPARKLE_DOWNLOAD_URL_PREFIX: https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/
          CHATGPT_SWIFT_SPARKLE_ED_PRIVATE_KEY: ${{ secrets.CHATGPT_SWIFT_SPARKLE_ED_PRIVATE_KEY }}
        run: ./packaging/make-sparkle-appcast.sh

      - name: Verify release artifacts
        env:
          DISTRIBUTION: ${{ inputs.distribution }}
          ENABLE_SPARKLE: ${{ inputs.enable_sparkle }}
          FEED_URL: ${{ inputs.feed_url }}
        run: |
          dmg_path="dist/ChatGPT Swift.dmg"
          appcast_path="dist/sparkle-appcast/appcast.xml"
          verify_mount="$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/chatgpt-swift-release-verify.XXXXXX")"
          mounted=0
          cleanup_verify_mount() {
            if [[ "$mounted" == "1" ]]; then
              /usr/bin/hdiutil detach "$verify_mount" >/dev/null 2>&1 || true
            fi
            rm -rf "$verify_mount"
          }
          trap cleanup_verify_mount EXIT

          test -f "$dmg_path"
          /usr/bin/hdiutil verify "$dmg_path"
          /usr/bin/hdiutil attach -readonly -nobrowse -mountpoint "$verify_mount" "$dmg_path" >/dev/null
          mounted=1
          app_path="$verify_mount/ChatGPT Swift.app"
          test -d "$app_path"
          ./packaging/verify-app-bundle.sh "$app_path" "$DISTRIBUTION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Contents/Info.plist")" = "$CHATGPT_SWIFT_SHORT_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Contents/Info.plist")" = "$CHATGPT_SWIFT_BUILD_NUMBER"
          if [[ "$DISTRIBUTION" == "developer-id" ]]; then
            /usr/bin/xcrun stapler validate "$dmg_path"
          fi
          if [[ "$ENABLE_SPARKLE" == "true" ]]; then
            test -f "$appcast_path"
            test "$(plutil -extract SUFeedURL raw -o - "$app_path/Contents/Info.plist")" = "$FEED_URL"
            test -n "$(plutil -extract SUPublicEDKey raw -o - "$app_path/Contents/Info.plist")"
            /usr/bin/xmllint --noout "$appcast_path"
            /usr/bin/grep -q 'sparkle:edSignature=' "$appcast_path"
          else
            if plutil -extract SUFeedURL raw -o - "$app_path/Contents/Info.plist" >/dev/null 2>&1; then
              echo "error: Sparkle feed URL is present while Sparkle updates are disabled" >&2
              exit 1
            fi
            if plutil -extract SUPublicEDKey raw -o - "$app_path/Contents/Info.plist" >/dev/null 2>&1; then
              echo "error: Sparkle public key is present while Sparkle updates are disabled" >&2
              exit 1
            fi
          fi
          cleanup_verify_mount
          trap - EXIT

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          DRAFT: ${{ inputs.draft }}
          ENABLE_SPARKLE: ${{ inputs.enable_sparkle }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          dmg_path="dist/ChatGPT Swift.dmg"
          appcast_path="dist/sparkle-appcast/appcast.xml"
          title="ChatGPT Swift $TAG"
          assets=("$dmg_path")
          if [[ "$ENABLE_SPARKLE" == "true" ]]; then
            assets+=("$appcast_path")
          fi

          release_error_file="$(mktemp -t chatgpt-swift-release-error.XXXXXX)"
          if gh release view "$TAG" >/dev/null 2>"$release_error_file"; then
            rm -f "$release_error_file"
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "error: existing release tag $TAG points to $tag_sha, but this run built $GITHUB_SHA" >&2
              exit 2
            fi
            is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "error: refusing to replace assets on published release $TAG; create a new version instead" >&2
              exit 2
            fi
            if [[ "$ENABLE_SPARKLE" != "true" ]]; then
              # A draft may have been created by an earlier Sparkle-enabled run. Do not publish a
              # stale appcast when this rerun intentionally disables Sparkle.
              asset_names="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
              if printf '%s\n' "$asset_names" | grep -Fxq 'appcast.xml'; then
                gh release delete-asset "$TAG" appcast.xml --yes
                asset_names="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
                if printf '%s\n' "$asset_names" | grep -Fxq 'appcast.xml'; then
                  echo "error: stale appcast.xml remains on release $TAG" >&2
                  exit 2
                fi
              fi
            fi
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --draft="$DRAFT" --prerelease="$PRERELEASE" --target "$GITHUB_SHA" --title "$title"
            exit 0
          elif grep -Eiq '(^|[^0-9])404([^0-9]|$)|not found|release not found' "$release_error_file"; then
            rm -f "$release_error_file"
          else
            cat "$release_error_file" >&2
            rm -f "$release_error_file"
            echo "error: unable to determine whether release $TAG exists" >&2
            exit 2
          fi

          release_args=(--title "$title" --generate-notes)
          if [[ "$DRAFT" == "true" ]]; then
            release_args+=(--draft)
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "$TAG" "${assets[@]}" --target "$GITHUB_SHA" "${release_args[@]}"
